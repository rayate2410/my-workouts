<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14213D">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="brand-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>MyWorkouts</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
/* Layout: one narrow column built for a phone. Week strip, then seven day rows;
   gym days open into tick lists with a kg box per lift. */
:root{
  --bg:#F2F4F9; --surface:#FFFFFF; --ink:#14213D; --mute:#5F6A85; --line:#DCE1EB; --line2:#B9C1D3;
  --hero:#14213D; --hero-ink:#FFFFFF; --hero-mute:#B8C3DC;
  --orange:#D9480F; --teal:#0F7F83; --green:#2A7F4F; --on-acc:#FFFFFF;
  --skip:#8A93A8; --chip:#E7EBF3;
  --f-head:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --f-body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1322; --surface:#172036; --ink:#E8ECF6; --mute:#9AA5BF; --line:#2A3552; --line2:#41507A;
  --hero:#1B2744; --hero-ink:#FFFFFF; --hero-mute:#A9B6D6;
  --orange:#FF7A3D; --teal:#3CC1C5; --green:#55C084; --on-acc:#0D1322;
  --skip:#7C86A0; --chip:#222E4B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1322; --surface:#172036; --ink:#E8ECF6; --mute:#9AA5BF; --line:#2A3552; --line2:#41507A;
  --hero:#1B2744; --hero-ink:#FFFFFF; --hero-mute:#A9B6D6;
  --orange:#FF7A3D; --teal:#3CC1C5; --green:#55C084; --on-acc:#0D1322;
  --skip:#7C86A0; --chip:#222E4B; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;
  padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--teal);outline-offset:2px}

.hero{background:var(--hero);color:var(--hero-ink);border-radius:18px;padding:18px 18px 16px}
.hero h1{font-family:var(--f-head);font-size:26px;line-height:1.1;margin:0 0 4px;font-weight:700;letter-spacing:-.01em}
.hero p{margin:0;color:var(--hero-mute);font-size:13px}
.days{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.card.today{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}

.walk{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px;min-height:56px}
.walk .lab{flex:1;min-width:0}
.dname{font-family:var(--f-head);font-weight:600;font-size:15px}
.ddate{color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
.seg{display:flex;gap:6px;flex:0 0 auto}
.pill{min-height:40px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line2);font-size:13px;font-weight:600;color:var(--mute);background:var(--surface)}
.pill.on-done{background:var(--teal);border-color:var(--teal);color:var(--on-acc)}
.pill.on-skip{background:var(--skip);border-color:var(--skip);color:var(--on-acc)}

.g-o{--acc:var(--orange)} .g-t{--acc:var(--teal)} .g-g{--acc:var(--green)}
.ghead{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px 10px 12px;text-align:left;min-height:64px}
.badge{flex:0 0 auto;width:42px;height:42px;border-radius:12px;background:var(--acc);color:var(--on-acc);display:grid;place-items:center}
.gtxt{flex:1;min-width:0}
.gtxt .t{font-family:var(--f-head);font-weight:600;font-size:15px;display:block}
.gtxt .s{color:var(--mute);font-size:12px;display:block}
.stat{flex:0 0 auto;font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--chip);color:var(--mute);font-variant-numeric:tabular-nums}
.stat.done{background:var(--acc);color:var(--on-acc)}
.stat.skip{background:var(--skip);color:var(--on-acc)}
.chev{flex:0 0 auto;color:var(--mute);transition:transform .15s}
.card.open .chev{transform:rotate(180deg)}
.gbody{display:none;border-top:1px solid var(--line);padding:4px 12px 12px}
.card.open .gbody{display:block}
.rest{color:var(--mute);font-size:12px;margin:8px 2px 4px}
.ex{display:grid;grid-template-columns:44px minmax(0,1fr) 100px;align-items:center;gap:6px;min-height:54px;border-bottom:1px solid var(--line)}
.ex:last-of-type{border-bottom:0}
.ck{width:44px;height:44px;display:grid;place-items:center}
.ck i{width:28px;height:28px;border-radius:9px;border:2px solid var(--line2);display:grid;place-items:center;color:transparent;transition:background .12s}
.ck[aria-checked="true"] i{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.exn{min-width:0}
.exn b{display:block;font-weight:500;font-size:14.5px}
.exn small{color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
.ex.isdone .exn b{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--line2)}
.kg{width:100%;font:inherit;font-size:16px;text-align:right;padding:8px 9px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums}
.kg::placeholder{color:var(--skip)}
.measure{display:flex;align-items:center;gap:5px;min-width:0}
.measure .kg{min-width:0;flex:1}
.measure small{color:var(--mute);font-size:12px}
.card.skipped .ex{opacity:.4}
.gfoot{display:flex;justify-content:flex-end;align-items:center;gap:6px;margin-top:8px}

.body{padding:14px}
.body h2{font-family:var(--f-head);font-size:16px;margin:0 0 10px}

.foot{text-align:center;color:var(--mute);font-size:12px;margin-top:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:360px){.pill{padding:0 10px}.walk{padding-left:10px}}

html{background:var(--bg)}
body{padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(40px,env(safe-area-inset-bottom,0px))}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.btn{min-height:46px;padding:0 16px;border-radius:12px;border:1.5px solid var(--line2);font-weight:600;font-size:14px;background:var(--surface);color:var(--ink)}
.btn.main{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.warn{background:var(--orange);border-color:var(--orange);color:var(--on-acc)}
.note{margin:10px 0 0;font-size:12.5px;color:var(--mute)}
.note.ok{color:var(--teal);font-weight:600}
.drive-backup{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.drive-backup h3{font-family:var(--f-head);font-size:14px;margin:0 0 8px}
.drive-backup .btns{margin-top:0}
.drive-backup .btn{flex:1 1 135px}
.drive-backup .note{overflow-wrap:anywhere}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.icon-btn{width:40px;height:40px;flex:0 0 40px;display:inline-grid;place-items:center;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--mute)}
.icon-btn svg{width:19px;height:19px}
.icon-btn.danger{color:var(--orange)}
.icon-btn:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.icon-btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.plan-tools{display:flex;align-items:center;gap:8px}
.plan-edit{padding:14px}
.plan-edit label{display:block;color:var(--mute);font-size:12px;margin:10px 0 4px}
.plan-edit input{width:100%;min-height:44px;font:inherit;padding:9px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.exercise-editor{display:grid;grid-template-columns:minmax(0,1fr) 40px;gap:6px;align-items:center;margin:8px 0;padding:8px;border:1px solid var(--line);border-radius:12px}
.exercise-editor input,.exercise-editor select{min-width:0;width:100%;min-height:42px;font:inherit;padding:8px;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}
.exercise-editor .exercise-name{grid-column:1}
.exercise-editor .icon-btn{grid-column:2;grid-row:1;width:40px;flex-basis:40px}
.exercise-meta{grid-column:1 / -1;display:grid;grid-template-columns:68px minmax(0,1fr) minmax(0,1fr);gap:6px}
.exercise-meta select{font-size:13px}
.exercise-new-name{grid-column:1 / -1}
.workout-add{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;align-items:center;margin:10px 0}
.workout-add select{min-width:0;min-height:44px;padding:8px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.plan-day{display:flex;align-items:center;gap:10px;padding:12px 14px}
.plan-day .lab{flex:1;min-width:0}
.app-head{display:flex;align-items:center;gap:12px;min-height:48px}
.app-head .icon-btn{width:44px;height:44px;flex-basis:44px}
.app-head .menu-trigger{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,33,61,.08)}
.brand-lockup{display:flex;align-items:center;gap:9px;min-width:0}
.brand-mark{display:block;width:38px;height:38px;flex:0 0 38px;border-radius:11px}
.brand-lockup h1{font-family:var(--f-head);font-size:19px;line-height:1.15;margin:0;font-weight:750;letter-spacing:-.02em}
.page-head{display:flex;align-items:center;gap:8px}
.page-head h2{flex:1;font-family:var(--f-head);font-size:18px;margin:0}
.icon-btn.text-icon{width:auto;flex-basis:auto;padding:0 12px;display:flex;gap:8px;font-size:13px;font-weight:600}
.day-nav{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.day-nav .icon-btn{width:44px;height:44px;flex-basis:44px}
.day-heading{display:flex;flex-direction:column;align-items:center;text-align:center;line-height:1.35}
.day-heading strong{font-family:var(--f-head);font-size:18px}
.day-heading span{font-size:13px;color:var(--mute)}
.day-heading small{font-size:11px;color:var(--teal);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.today-link{align-self:center;justify-self:center;color:var(--teal);font-size:13px;font-weight:600;padding:5px 10px}
.streak-card{width:100%;padding:14px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.streak-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.streak-top strong{font-family:var(--f-head);font-size:15px}
.streak-count{color:var(--teal);font-size:13px;font-weight:700}
.streak-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:12px}
.streak-day{display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--mute);font-size:10px}
.streak-dot{width:30px;height:30px;display:grid;place-items:center;border:1.5px solid var(--line2);border-radius:50%;font-size:12px;font-weight:600;color:var(--ink)}
.streak-day.done .streak-dot{background:var(--teal);border-color:var(--teal);color:var(--on-acc)}
.streak-day.today .streak-dot{box-shadow:0 0 0 2px var(--ink)}
.calendar-panel{padding:14px}
.calendar-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.calendar-head h2{font-family:var(--f-head);font-size:17px;margin:0}
.calendar-head input{min-height:42px;max-width:175px;padding:7px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.calendar-label{padding:5px 0;text-align:center;color:var(--mute);font-size:11px;font-weight:600}
.calendar-date{min-width:0;aspect-ratio:1;border:1.5px solid transparent;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px}
.calendar-date.done{background:var(--teal);color:var(--on-acc)}
.calendar-date.today{border-color:var(--ink)}
.calendar-date.other{visibility:hidden}
.calendar-date small{font-size:9px;line-height:1}
.calendar-legend{display:flex;align-items:center;gap:7px;margin:12px 0 0;color:var(--mute);font-size:12px}
.legend-dot{width:12px;height:12px;border-radius:50%;background:var(--teal)}
.menu-backdrop{position:fixed;inset:0;z-index:20;background:rgba(7,12,24,.52);display:flex}
.side-menu{width:min(84vw,320px);height:100%;height:100dvh;padding:max(18px,env(safe-area-inset-top,0px)) 16px max(18px,env(safe-area-inset-bottom,0px));background:var(--surface);box-shadow:8px 0 30px rgba(0,0,0,.2);display:flex;flex-direction:column;gap:8px}
.menu-head{display:flex;align-items:center;gap:10px;padding:4px 0 14px;border-bottom:1px solid var(--line);margin-bottom:4px}
.menu-head strong{flex:1;font-family:var(--f-head);font-size:17px}
.menu-head .brand-lockup{flex:1}
.menu-link{display:flex;align-items:center;min-height:50px;padding:0 12px;border-radius:12px;text-align:left;font-weight:600}
.menu-link[aria-current="page"]{background:var(--chip);color:var(--teal)}
@media (max-width:380px){.ex{grid-template-columns:40px minmax(0,1fr) 88px;gap:4px}.exercise-meta{grid-template-columns:60px minmax(0,1fr) minmax(0,1fr);gap:4px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
(function(){
"use strict";
const CLIENT_ID = '94614380538-vptj6rt9qna9dpv8okgonl7s3kp6l3o1.apps.googleusercontent.com';
const DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.file";
const DRIVE_SYNC_KEY = "my-workouts-drive-last-sync-v1";
var LEGACY_START=new Date(2026,10,16);
function monday(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
function isoDate(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
var DAYS=[
 {k:"mon",n:"Mon",walk:true},{k:"tue",n:"Tue",walk:true},
 {k:"wed",n:"Wed",g:"o",t:"Full Body A",s:"Legs + push / pull",rest:"Rest 90 s to 2 min between sets"},
 {k:"thu",n:"Thu",g:"t",t:"Upper Body + Core B",s:"Chest, back, shoulders, arms",rest:"Rest 60 to 90 s between sets"},
 {k:"fri",n:"Fri",walk:true},
 {k:"sat",n:"Sat",g:"g",t:"Full Body C",s:"Hinge + squat + pull",rest:"Rest 90 s to 2 min between sets"},
 {k:"sun",n:"Sun",walk:true}
];

function lifts(day,wk){
  var bb=wk>=3;
  var L={
   wed:[
    bb?{id:"sq_bb",n:"Barbell Box Squat",s:3,r:"8-10"}:{id:"sq_db",n:"Front Squat to Box (two DBs)",s:3,r:"10"},
    {id:"cp",n:"Chest Press Machine",s:3,r:"8-12"},
    {id:"lp",n:"Lat Pulldown",s:3,r:"10"},
    bb?{id:"rdl_bb",n:"Barbell Romanian Deadlift",s:3,r:"8-10"}:{id:"rdl_db",n:"DB Romanian Deadlift",s:3,r:"10"},
    {id:"fp",n:"Face Pull (functional trainer)",s:2,r:"15"},
    {id:"pl",n:"Plank",s:3,r:"30-40 s",bw:1}],
   thu:[
    {id:"ip",n:"Incline DB Press",s:3,r:"8-10"},
    {id:"sr",n:"Seated Cable Row",s:3,r:"10-12"},
    {id:"sp",n:"Seated DB Shoulder Press",s:3,r:"8-10"},
    {id:"cf",n:"Chest Fly Machine",s:2,r:"12-15"},
    {id:"bt",n:"Biceps Curl + Triceps Pushdown",s:2,r:"12"},
    {id:"lr",n:"Cable Lateral Raise",s:2,r:"15"},
    {id:"db",n:"Dead Bug",s:2,r:"8 per side",bw:1}],
   sat:[
    {id:"pt",n:"Cable Pull-Through",s:3,r:"12"},
    {id:"gs",n:"Goblet Box Squat",s:3,r:"12"},
    {id:"bp",n:"DB Bench Press",s:3,r:"8-10"},
    {id:"or",n:"One-Arm DB Row",s:3,r:"10 per side"},
    bb?{id:"ht_bb",n:"Barbell Hip Thrust",s:3,r:"10-12"}:{id:"ht_db",n:"DB Hip Thrust",s:3,r:"12"},
    {id:"fc",n:"Farmer Carry",s:3,r:"30 m"}]
  }[day];
  return L.map(function(x){return {id:x.id,n:x.n,s:x.s,r:x.r,bw:x.bw};});
}

/* ---------- state ---------- */
var LS="recomp-log-v1";
var state={t:0,s:{},body:{},p:{},templates:{},exercises:{},workouts:{},start:isoDate(monday(new Date()))};
var open={};
var wkSel=1;
var daySel=0;
var page="log", editorTarget=null;
var streakMonth=isoDate(today()).slice(0,7);

function normalize(d){
  var o={t:0,s:{},body:{},p:{},templates:{},exercises:{},workouts:{},start:isoDate(monday(new Date()))};
  if(d&&typeof d==="object"){
    if(typeof d.t==="number")o.t=d.t;
    if(d.s&&typeof d.s==="object")o.s=d.s;
    if(d.body&&typeof d.body==="object")o.body=d.body;
    if(d.p&&typeof d.p==="object")o.p=d.p;
    if(d.templates&&typeof d.templates==="object")o.templates=d.templates;
    if(d.exercises&&typeof d.exercises==="object")o.exercises=d.exercises;
    if(d.workouts&&typeof d.workouts==="object")o.workouts=d.workouts;
    if(typeof d.start==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(d.start))o.start=d.start;
    else if(d.s)o.start=isoDate(LEGACY_START);
    if(d.s&&!d.p)Object.keys(d.s).forEach(function(key){
      var sep=key.lastIndexOf("-"), wk=+key.slice(0,sep), dayKey=key.slice(sep+1);
      var day=DAYS.filter(function(x){return x.k===dayKey;})[0];
      if(day)o.p[key]=day.walk?{title:"Walk 5 km",details:"",rest:"",exercises:[]}:
        {title:day.t,details:day.s,rest:day.rest,exercises:lifts(day.k,wk)};
    });
    if(!d.templates)Object.keys(o.p).forEach(function(key){
      var sep=key.lastIndexOf("-"), dayKey=key.slice(sep+1), wk=+key.slice(0,sep), plan=o.p[key];
      if(plan&&(!o.templates[dayKey]||wk>o.templates[dayKey].wk))o.templates[dayKey]={wk:wk,plan:plan};
    });
    Object.keys(o.templates).forEach(function(key){if(o.templates[key]&&o.templates[key].plan)o.templates[key]=o.templates[key].plan;});
  }
  function normalizePlan(plan){
    if(!plan||!Array.isArray(plan.exercises))return;
    plan.exercises=plan.exercises.map(function(item){
      var id=item.id||"exercise-"+Date.now()+"-"+Math.random().toString(36).slice(2);
      if(!o.exercises[id])o.exercises[id]={id:id,n:item.n||"Exercise"};
      return {id:id,s:item.s||3,r:item.r||"",unit:item.unit||(item.bw?"bodyweight":"kg")};
    });
  }
  Object.keys(o.templates).forEach(function(key){
    var plan=o.templates[key];
    normalizePlan(plan);
    if(plan&&!o.workouts["legacy-"+key]){
      o.workouts["legacy-"+key]={id:"legacy-"+key,title:plan.title||"Workout",details:plan.details||"",rest:plan.rest||"",exercises:plan.exercises.map(function(x){return {id:x.id,s:x.s,r:x.r,unit:x.unit};})};
    }
  });
  Object.keys(o.p).forEach(function(key){normalizePlan(o.p[key]);});
  Object.keys(o.workouts).forEach(function(key){
    var workout=o.workouts[key];
    if(workout&&Array.isArray(workout.exercises))normalizePlan(workout);
  });
  return o;
}
try{var raw=localStorage.getItem(LS); if(raw)state=normalize(JSON.parse(raw));}catch(e){}

var syncMode="local"; // local | cloud
var ref=null, writing=false, dirty=false, wtimer=null;
function save(){
  state.t=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}
  if(ref){dirty=true; clearTimeout(wtimer); wtimer=setTimeout(flush,700);}
}
function flush(){
  if(!ref||writing||!dirty)return;
  writing=true; dirty=false;
  var snap={v:4,t:state.t,s:state.s,body:state.body,p:state.p,templates:state.templates,exercises:state.exercises,workouts:state.workouts,start:state.start};
  ref.set(snap).catch(function(){syncMode="local";paintStatus();}).then(function(){
    writing=false; if(dirty)flush();
  });
}

function keyFor(wk,day){return wk+"-"+day;}
function sess(wk,day){var k=keyFor(wk,day);return state.s[k]||(state.s[k]={st:"",ex:{}});}
function peek(wk,day){return state.s[wk+"-"+day]||null;}
function planFor(wk,d){
  var key=keyFor(wk,d.k);
  if(Object.prototype.hasOwnProperty.call(state.p,key))return state.p[key];
  return state.templates[d.k]||null;
}
function gymStatus(wk,d){
  var plan=planFor(wk,d), s=peek(wk,d.k), n=plan?plan.exercises.length:0;
  if(!plan)return {k:"",done:0,n:0};
  if(s&&s.st==="skip")return {k:"skip",done:0,n:n};
  var c=0; if(s)for(var id in s.ex){if(s.ex[id]&&s.ex[id].d)c++;}
  return {k:n===0?(s&&s.st==="done"?"done":""):(c>=n?"done":(c>0?"part":"")),done:c,n:n};
}
function exerciseUnit(x){return x.unit||(x.bw?"bodyweight":"kg");}
function exerciseName(x){var exercise=state.exercises[x.id];return exercise&&exercise.n||x.n||"Exercise";}
function exerciseRecord(id){return state.exercises[id]||null;}
function lastMeasure(wk,x){
  var unit=exerciseUnit(x);
  for(var w=wk-1;w>=wk-520;w--){
    for(var i=0;i<DAYS.length;i++){
      var s=peek(w,DAYS[i].k);
      var e=s&&s.ex&&s.ex[x.id];
      if(!e)continue;
      var value=e.v!=null?e.v:e.kg, previousUnit=e.u||(e.kg!=null?"kg":unit);
      if(value!=null&&previousUnit===unit)return value;
    }
  }
  return "";
}
function loggedMeasure(e,unit){
  if(e.v!=null)return e.u===unit?e.v:"";
  return unit==="kg"&&e.kg!=null?e.kg:"";
}

/* ---------- dates ---------- */
function startDate(){var a=state.start.split("-");return new Date(+a[0],+a[1]-1,+a[2]);}
function dateOf(wk,i){var d=startDate();d.setDate(d.getDate()+7*(wk-1)+i);return d;}
function fmt(d){return d.toLocaleDateString("en-IN",{day:"numeric",month:"short"});}
function today(){var n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());}
function todayPos(){
  var diff=Math.round((today()-startDate())/86400000);
  var wk=Math.floor(diff/7)+1;
  return {wk:wk,i:diff-7*(wk-1)};
}

function h(tag,props){
  var el=document.createElement(tag);
  if(props)for(var k in props){
    var v=props[k];
    if(k==="class")el.className=v;
    else if(k==="html")el.innerHTML=v;
    else if(k.slice(0,2)==="on")el.addEventListener(k.slice(2),v);
    else if(v===true)el.setAttribute(k,"");
    else if(v!==false&&v!=null)el.setAttribute(k,v);
  }
  for(var i=2;i<arguments.length;i++){
    var c=arguments[i]; if(c==null)continue;
    el.appendChild(typeof c==="string"?document.createTextNode(c):c);
  }
  return el;
}

function datePosition(date){
  var diff=Math.round((date-startDate())/86400000), wk=Math.floor(diff/7)+1;
  return {wk:wk,i:diff-7*(wk-1)};
}

function isDayDone(date){
  var pos=datePosition(date), d=DAYS[pos.i], plan=planFor(pos.wk,d), s=peek(pos.wk,d.k);
  if(!plan||!s||s.st==="skip")return false;
  if(!plan.exercises.length)return s.st==="done";
  return plan.exercises.every(function(x){return !!(s.ex&&s.ex[x.id]&&s.ex[x.id].d);});
}

function streakLength(){
  var cursor=today(), count=0;
  if(!isDayDone(cursor))cursor.setDate(cursor.getDate()-1);
  for(var i=0;i<3660&&isDayDone(cursor);i++,count++)cursor.setDate(cursor.getDate()-1);
  return count;
}

function streakCard(){

    var done=isDayDone(date), todayDate=i===6;
    week.appendChild(h("span",{class:"streak-day"+(done?" done":"")+(todayDate?" today":"")},
      h("span",null,date.toLocaleDateString("en-IN",{weekday:"short"}).slice(0,1)),
      h("span",{class:"streak-dot"},done?"✓":String(date.getDate()))));
  }
  return h("button",{class:"streak-card",type:"button","aria-label":"View streak calendar",
    onclick:function(){streakMonth=isoDate(today()).slice(0,7);page="streaks";render();}},
    h("span",{class:"streak-top"},h("strong",null,"Streaks · last 7 days"),h("span",{class:"streak-count"},streakLength()+" day streak")),
    week);

          var x=exerciseRows[i], exerciseId=x.id, exerciseNameValue=x.newName.value.trim(), sets=parseInt(x.sets.value,10), reps=x.reps.value.trim();
          if(!exerciseId&&exerciseNameValue){
            exerciseId="exercise-"+Date.now()+"-"+Math.random().toString(36).slice(2);
            newExercises.push({id:exerciseId,n:exerciseNameValue});
          }
          if(!exerciseId||!sets||sets<1||!reps){message.textContent="Choose or enter an exercise, then complete its sets and reps.";return;}
          items.push({id:exerciseId,s:sets,r:reps,unit:x.unit.value});
        }
        newExercises.forEach(function(exercise){state.exercises[exercise.id]=exercise;});
        var saved={title:name,details:details.value.trim(),rest:rest.value.trim(),exercises:items};
        if(type==="workout"){
          var workoutId=editorTarget.id||("workout-"+Date.now()+"-"+Math.random().toString(36).slice(2));
          saved.id=workoutId;state.workouts[workoutId]=saved;
        }else if(type==="template"){
          state.templates[d.k]=saved;
          var legacy=state.workouts["legacy-"+d.k];
          if(legacy)state.workouts["legacy-"+d.k]={id:legacy.id,title:name,details:saved.details,rest:saved.rest,exercises:items.map(function(x){return {id:x.id,s:x.s,r:x.r,unit:x.unit};})};
        }
        else{
          state.p[key]=saved;
          var session=sess(wkSel,d.k), nextEx={};
          items.forEach(function(x){if(session.ex[x.id])nextEx[x.id]=session.ex[x.id];});
          session.ex=nextEx;
        }
        save();page=type==="workout"?"workouts":(type==="template"?"plans":"log");editorTarget=null;render();
      },"text-icon primary",type==="workout"?"Save workout":"Save plan"),
      type==="override"&&Object.prototype.hasOwnProperty.call(state.p,key)?iconButton("back","Use weekday plan again",function(){
        delete state.p[key];save();page="log";editorTarget=null;render();
      }):null,
      type==="override"?iconButton("trash","Remove this day's workout",function(){
        if(!window.confirm("Remove the workout and log for this date?"))return;
        state.p[key]=null;delete state.s[key];save();page="log";editorTarget=null;render();
      },"danger"):null));
  if(!existing.length&&!workoutAdd)addExercise();
  return editor;
}

function gymCard(d,dt,isToday){
  var key=keyFor(wkSel,d.k), plan=planFor(wkSel,d);
  var gs=gymStatus(wkSel,d);
  var isOpen=open[key]===undefined?true:open[key];
  var card=h("div",{class:"card g-"+(d.g||"o")+(isOpen?" open":"")+(isToday?" today":"")+(gs.k==="skip"?" skipped":"")});
  var label=gs.k==="skip"?"Skipped":(gs.k==="done"?"Done":gs.done+"/"+gs.n);
  var head=h("button",{class:"ghead","aria-expanded":isOpen?"true":"false",onclick:function(){
      var now=!card.classList.contains("open"); open[key]=now; card.classList.toggle("open",now); head.setAttribute("aria-expanded",now?"true":"false");}},
    h("span",{class:"badge",html:DUMB}),
    h("span",{class:"gtxt"},h("span",{class:"t"},d.n+": "+plan.title),h("span",{class:"s"},fmt(dt)+(plan.details?" · "+plan.details:"")+(isToday?" (today)":""))),
    h("span",{class:"stat"+(gs.k==="done"?" done":(gs.k==="skip"?" skip":"")),id:"stat-"+d.k},label),
    h("span",{class:"chev",html:CHEV}));
  card.appendChild(head);

  var body=h("div",{class:"gbody"});
  body.appendChild(h("p",{class:"rest"},plan.rest||""));
  var s=peek(wkSel,d.k);
  plan.exercises.forEach(function(x){
    var e=(s&&s.ex&&s.ex[x.id])||{};
    var name=exerciseName(x);
    var unit=exerciseUnit(x);
    var on=!!e.d;
    var ck=h("button",{class:"ck",role:"checkbox","aria-checked":on?"true":"false","aria-label":name,onclick:function(){
        var z=sess(wkSel,d.k); if(z.st==="skip")z.st="";
        z.ex[x.id]=z.ex[x.id]||{}; z.ex[x.id].d=z.ex[x.id].d?0:1; save(); open[key]=true; render();}},
      h("i",{html:TICK}));
    var row=h("div",{class:"ex"+(on?" isdone":"")},ck,
      h("div",{class:"exn"},h("b",null,name),h("small",null,x.s+" x "+x.r)));
    if(unit==="bodyweight"||unit==="none"){row.appendChild(h("span"));}
    else{
      var previous=lastMeasure(wkSel,x);
      var inp=h("input",{class:"kg",type:"text",inputmode:"decimal",placeholder:previous?String(previous):"—","aria-label":name+" value in "+unit,id:"measure-"+wkSel+"-"+x.id,
        oninput:function(){var z=sess(wkSel,d.k); z.ex[x.id]=z.ex[x.id]||{}; z.ex[x.id].v=inp.value.replace(/[^0-9.]/g,"").slice(0,8); z.ex[x.id].u=unit; save();}});
      inp.value=loggedMeasure(e,unit);
      row.appendChild(h("div",{class:"measure"},inp,h("small",null,unit)));
    }
    body.appendChild(row);
  });
  var skipped=gs.k==="skip";
  body.appendChild(h("div",{class:"gfoot"},
    h("button",{class:"pill"+(skipped?" on-skip":""),"aria-pressed":skipped,onclick:function(){
      var z=sess(wkSel,d.k); z.st=skipped?"":"skip"; save(); open[key]=true; render();}},skipped?"Skipped (tap to undo)":"Skip this session"),
    iconButton("edit","Change workout for "+fmt(dt),function(){editorTarget={type:"override",day:d};page="editor";render();})));
  if(plan.exercises.length===0)body.appendChild(h("button",{class:"pill"+(gs.k==="done"?" on-done":""),onclick:function(){
    var z=sess(wkSel,d.k);z.st=z.st==="done"?"":"done";save();render();
  }},"Mark workout done"));
  card.appendChild(body);
  return card;
}

/* ---------- backup ---------- */
var importPending=null, backupMsg="", backupOk=false;
var driveAccessToken="", driveTokenExpiry=0, driveTokenClient=null;
var driveStatus="", driveBusy=false, pendingDriveAction=null, driveLastSync="";
var pendingDriveRestore=false;
try{driveLastSync=localStorage.getItem(DRIVE_SYNC_KEY)||"";}catch(e){}
function iso(d){var m=d.getMonth()+1,dd=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(dd<10?"0":"")+dd;}
function readable(){
  var out=[];
  Object.keys(state.s).forEach(function(key){
    var sep=key.lastIndexOf("-"), wk=+key.slice(0,sep), dayKey=key.slice(sep+1);
    var i=DAYS.findIndex(function(d){return d.k===dayKey;}), d=DAYS[i], s=state.s[key];
    if(!d||!s)return;
    var plan=planFor(wk,d); if(!plan)return;
    var items=[],any=false;
    plan.exercises.forEach(function(x){
      var e=(s.ex&&s.ex[x.id])||{};
      var unit=exerciseUnit(x), value=e.v!=null?e.v:e.kg, loggedUnit=e.u||(e.kg!=null?"kg":unit);
      if(e.d||value)any=true;
      items.push({lift:exerciseName(x),sets:x.s,reps:x.r,done:!!e.d,unit:loggedUnit,value:value!=null?parseFloat(value):null,kg:loggedUnit==="kg"&&value!=null?parseFloat(value):null});
    });
    if(!any&&!s.st)return;
    var status=s.st==="skip"?"skipped":(gymStatus(wk,d).k==="done"?"done":(gymStatus(wk,d).k==="part"?"partial":"not started"));
    out.push({week:wk,date:iso(dateOf(wk,i)),day:d.n,type:plan.title,status:status,lifts:items});
  });
  out.sort(function(a,b){return a.date.localeCompare(b.date);});
  return out;
}
function exportText(){
  return JSON.stringify({app:"MyWorkouts",version:4,exportedAt:new Date().toISOString(),programStart:state.start,
    log:readable(),bodyChecks:state.body,raw:{t:state.t,s:state.s,body:state.body,p:state.p,templates:state.templates,exercises:state.exercises,workouts:state.workouts,start:state.start}},null,1);
}
function parseBackup(text){
  var o=JSON.parse(String(text)), raw=(o&&o.raw)?o.raw:o;
  if(!raw||!raw.s||typeof raw.s!=="object"||Array.isArray(raw.s))throw new Error("That file is not a MyWorkouts backup.");
  return normalize(raw);
}
function applyImport(){
  if(!importPending)return;
  state=importPending;importPending=null;state.t=Date.now();save();
  if(pendingDriveRestore){pendingDriveRestore=false;if(saveDriveSyncTime())driveStatus="Google Drive backup restored.";}
  backupMsg="Data restored.";backupOk=true;render();
}
function fileName(){return "MyWorkouts-"+iso(new Date())+".json";}
function doDownload(){
  var blob=new Blob([exportText()],{type:"application/json"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=fileName();
  document.body.appendChild(a); a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);
  backupMsg="Backup file saved to your downloads."; backupOk=true; render();
}
function doShare(){
  try{
    var f=new File([exportText()],fileName(),{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){
      navigator.share({files:[f],title:"MyWorkouts"}).catch(function(){});
      return;
    }
  }catch(e){}
  doDownload();
}
function onPick(ev){
  var f=ev.target.files&&ev.target.files[0]; if(!f)return;
  pendingDriveRestore=false;
  var r=new FileReader();
  r.onload=function(){
    try{
      importPending=parseBackup(r.result); backupMsg="";
    }catch(e){importPending=null;backupMsg=e.message||"That file is not a MyWorkouts backup.";backupOk=false;}
    render();
  };
  r.readAsText(f); ev.target.value="";
}
function driveConnected(){return !!driveAccessToken&&Date.now()<driveTokenExpiry;}
function driveTokenCallback(response){
  driveBusy=false;
  if(!response||response.error||!response.access_token){
    pendingDriveAction=null;
    driveStatus=response&&response.error_description?response.error_description:"Google Drive authorization was not completed.";
    render();return;
  }
  driveAccessToken=response.access_token;
  driveTokenExpiry=Date.now()+Math.max(0,(Number(response.expires_in)||3600)-60)*1000;
  var pending=pendingDriveAction;pendingDriveAction=null;
  driveStatus="Google Drive connected.";
  render();
  if(pending&&pending.action)runDriveAction(pending.action,pending.retried);
}
function requestDriveToken(action,prompt,retried){
  if(CLIENT_ID==="YOUR_GOOGLE_CLIENT_ID"){
    driveStatus="Set CLIENT_ID in index.html to your Google OAuth web client ID.";
    driveBusy=false;render();return;
  }
  if(!window.google||!google.accounts||!google.accounts.oauth2){
    driveStatus="Google Identity Services is still loading. Try again shortly.";
    driveBusy=false;render();return;
  }
  pendingDriveAction={action:action,retried:!!retried};
  try{
    if(!driveTokenClient)driveTokenClient=google.accounts.oauth2.initTokenClient({
      client_id:CLIENT_ID,scope:DRIVE_SCOPE,callback:driveTokenCallback
    });
    driveTokenClient.requestAccessToken({prompt:prompt||""});
  }catch(e){
    pendingDriveAction=null;driveBusy=false;
    driveStatus="Could not start Google authorization: "+e.message;render();
  }
}
function disconnectDrive(){
  var token=driveAccessToken;
  driveAccessToken="";driveTokenExpiry=0;pendingDriveAction=null;driveBusy=false;
  if(token&&window.google&&google.accounts&&google.accounts.oauth2)google.accounts.oauth2.revoke(token,function(){});
  driveStatus="Google Drive disconnected.";render();
}
async function driveFetch(url,options,action,retried){
  options=options||{};options.headers=options.headers||{};
  options.headers.Authorization="Bearer "+driveAccessToken;
  var response=await fetch(url,options);
  if(response.status===401&&!retried){
    driveAccessToken="";driveTokenExpiry=0;driveBusy=true;
    requestDriveToken(action,"",true);return null;
  }
  if(!response.ok){
    var text=await response.text(), detail=text;
    try{var data=JSON.parse(text);detail=data.error&&data.error.message||text;}catch(e){}
    throw new Error("Google Drive error ("+response.status+"): "+(detail||response.statusText));
  }
  return response;
}
function saveDriveSyncTime(){
  driveLastSync=new Date().toISOString();
  try{localStorage.setItem(DRIVE_SYNC_KEY,driveLastSync);return true;}
  catch(e){driveStatus="Drive operation succeeded, but the sync time could not be saved on this device.";return false;}
}
async function runDriveAction(action,retried){
  if(!driveConnected()){
    driveBusy=true;driveStatus="Waiting for Google authorization…";
    requestDriveToken(action,"",retried);render();return;
  }
  driveBusy=true;driveStatus=action==="backup"?"Backing up to Google Drive…":"Restoring from Google Drive…";render();
  try{
    var query=encodeURIComponent("name = 'workout_logs.json' and trashed = false");
    var list=await driveFetch("https://www.googleapis.com/drive/v3/files?q="+query+"&spaces=drive&pageSize=100&orderBy=modifiedTime desc&fields=files(id,name,modifiedTime)",null,action,retried);
    if(!list)return;
    var files=(await list.json()).files||[];
    if(action==="backup"){
      var boundary="myworkouts_"+Date.now().toString(36);
      var metadata=JSON.stringify({name:"workout_logs.json",mimeType:"application/json"});
      var multipart=new Blob([
        "--"+boundary+"\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n"+metadata+"\r\n",
        "--"+boundary+"\r\nContent-Type: application/json\r\n\r\n"+exportText()+"\r\n",
        "--"+boundary+"--"
      ],{type:"multipart/related; boundary="+boundary});
      var existing=files[0]||null;
      var url="https://www.googleapis.com/upload/drive/v3/files"+(existing?"/"+encodeURIComponent(existing.id):"")+"?uploadType=multipart&fields=id,name,modifiedTime";
      var uploaded=await driveFetch(url,{method:existing?"PATCH":"POST",headers:{"Content-Type":"multipart/related; boundary="+boundary},body:multipart},action,retried);
      if(!uploaded)return;
      await uploaded.json();
      if(saveDriveSyncTime())driveStatus="Backup saved to Google Drive.";
    }else if(action==="restore"){
      if(!files.length){driveStatus="No workout_logs.json backup was found in Google Drive.";return;}
      var file=await driveFetch("https://www.googleapis.com/drive/v3/files/"+encodeURIComponent(files[0].id)+"?alt=media",null,action,retried);
      if(!file)return;
      importPending=parseBackup(await file.text());
      pendingDriveRestore=true;backupMsg="Replace everything on this phone with the Google Drive backup?";backupOk=false;
      driveStatus="Drive backup loaded. Confirm below to restore.";
    }
  }catch(e){driveStatus=e.message||"Google Drive operation failed.";}
  finally{
    if(!pendingDriveAction){driveBusy=false;render();}
  }
}
function driveAction(action){
  if(driveBusy)return;
  runDriveAction(action,false);
}
function driveStatusText(){
  var last=driveLastSync?" Last synced "+new Date(driveLastSync).toLocaleString()+".":" No Drive backup yet.";
  return (driveStatus?driveStatus+" ":"")+(driveConnected()?"Connected.":"Not connected.")+last;
}

function backupCard(){
  var pick=h("input",{type:"file",accept:".json,application/json",id:"imp","aria-label":"Choose backup file",onchange:onPick});
  var connected=!!driveAccessToken;
  var drive=h("section",{class:"drive-backup"},
    h("h3",null,"Google Drive"),
    h("div",{class:"btns"},
      h("button",{class:"btn"+(connected?"":" main"),onclick:function(){
        if(connected){disconnectDrive();return;}
        if(driveBusy)return;
        driveBusy=true;driveStatus="Connecting to Google Drive…";render();
        requestDriveToken(null,"consent",false);
      }},connected?"Disconnect Google Drive":"Connect Google Drive"),
      h("button",{class:"btn",disabled:!connected||driveBusy,onclick:function(){driveAction("backup");}},"Backup to Drive"),
      h("button",{class:"btn",disabled:!connected||driveBusy,onclick:function(){driveAction("restore");}},"Restore from Drive")),
    h("p",{class:"note","aria-live":"polite"},driveStatusText()));
  var c=h("section",{class:"card body"},
    h("h2",null,"Backup"),
    h("div",{class:"btns"},
      h("button",{class:"btn main",onclick:doDownload},"Export data"),
      h("button",{class:"btn",onclick:doShare},"Share"),
      h("button",{class:"btn",onclick:function(){pick.click();}},"Import")),
    pick,drive);
  if(importPending){
    c.appendChild(h("p",{class:"note"},"Replace everything on this phone with the file you picked?"));
    c.appendChild(h("div",{class:"btns"},
      h("button",{class:"btn warn",onclick:applyImport},"Replace"),
      h("button",{class:"btn",onclick:function(){importPending=null;pendingDriveRestore=false;render();}},"Cancel")));
  }
  if(backupMsg)c.appendChild(h("p",{class:"note"+(backupOk?" ok":"")},backupMsg));
  return c;
}
